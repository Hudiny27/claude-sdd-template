# SDD merge gate: a pull request that changes code must also change a spec,
# and its branch must have a feature spec under Plans/.
# Opt out per PR with the label "no-spec-change".
# Make it binding with branch protection: require the "spec-sync" check.
name: sdd-check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  spec-sync:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-spec-change') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Code changes come with spec changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 .claude/hooks/sdd_guard.py ci "$BASE_SHA" "$HEAD_BRANCH"
